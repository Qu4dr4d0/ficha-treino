<title>Ficha Treino e Dieta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: uma coluna de app de celular (até 480px). Na home, cards no estilo bloco de notas; as telas de treino e dieta assumem a cor do card; edições sobem em sheets e o descanso flutua num dock fixo embaixo. */
:root{
  --bg:#ffffff; --fg:#202124; --fg2:#5f6368; --fg3:#80868b;
  --line:#dadce0; --hair:rgba(32,33,36,.16); --tint:rgba(32,33,36,.055); --tint2:rgba(32,33,36,.095);
  --ink:#202124; --on-ink:#ffffff; --sheet:#ffffff; --scrim:rgba(32,33,36,.42);
  --good:#137333; --on-good:#ffffff; --good-soft:rgba(19,115,51,.14);
  --danger:#c5221f; --accent:#f9ab00; --on-accent:#202124; --ring:#fbbc04;
  --shadow:0 1px 3px rgba(60,64,67,.22),0 8px 22px rgba(60,64,67,.18);
  --c-default:#ffffff; --c-coral:#faafa8; --c-peach:#f39f76; --c-sand:#fff8b8; --c-mint:#e2f6d3; --c-sage:#b4ddd3; --c-fog:#d4e4ed; --c-storm:#aeccdc; --c-dusk:#d3bfdb; --c-blossom:#f6e2dd; --c-clay:#e9e3d4; --c-chalk:#efeff1;
  --screen-bg:var(--bg);
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-sym:"Nunito",ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif;
  --r-card:18px; --r-row:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#202124; --fg:#e8eaed; --fg2:#9aa0a6; --fg3:#80868b;
    --line:#5f6368; --hair:rgba(232,234,237,.18); --tint:rgba(232,234,237,.065); --tint2:rgba(232,234,237,.11);
    --ink:#e8eaed; --on-ink:#202124; --sheet:#2d2e31; --scrim:rgba(0,0,0,.6);
    --good:#81c995; --on-good:#202124; --good-soft:rgba(129,201,149,.18);
    --danger:#f28b82; --accent:#fdd663; --on-accent:#202124; --ring:#e37400;
    --shadow:0 2px 6px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.4);
    --c-default:#202124; --c-coral:#77172e; --c-peach:#692b17; --c-sand:#7c4a03; --c-mint:#264d3b; --c-sage:#0c625d; --c-fog:#256377; --c-storm:#284255; --c-dusk:#472e5b; --c-blossom:#6c394f; --c-clay:#4b443a; --c-chalk:#232427;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#202124; --fg:#e8eaed; --fg2:#9aa0a6; --fg3:#80868b;
  --line:#5f6368; --hair:rgba(232,234,237,.18); --tint:rgba(232,234,237,.065); --tint2:rgba(232,234,237,.11);
  --ink:#e8eaed; --on-ink:#202124; --sheet:#2d2e31; --scrim:rgba(0,0,0,.6);
  --good:#81c995; --on-good:#202124; --good-soft:rgba(129,201,149,.18);
  --danger:#f28b82; --accent:#fdd663; --on-accent:#202124; --ring:#e37400;
  --shadow:0 2px 6px rgba(0,0,0,.45),0 10px 26px rgba(0,0,0,.4);
  --c-default:#202124; --c-coral:#77172e; --c-peach:#692b17; --c-sand:#7c4a03; --c-mint:#264d3b; --c-sage:#0c625d; --c-fog:#256377; --c-storm:#284255; --c-dusk:#472e5b; --c-blossom:#6c394f; --c-clay:#4b443a; --c-chalk:#232427;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--screen-bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background-color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--screen-bg)}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
h1,h2,h3,p,ul,dl,dd,figure{margin:0;padding:0}
ul{list-style:none}
.i{width:22px;height:22px;flex:none;display:block}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-stretch:80%}
.mut{color:var(--fg2)}
.sm{font-size:13px}
.block{display:block}
.grow{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--tint2);color:var(--fg2);flex:none}

/* ---------- estrutura ---------- */
.screen{padding-bottom:56px}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:2px;height:56px;margin:0 -10px -8px;background:var(--screen-bg);transition:background-color .25s}
.tb-title{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.ib:hover{background:var(--tint)}
.ib:active{background:var(--tint2)}
.ib.on,.ib.on:hover{background:var(--ink);color:var(--on-ink)}
.ib:disabled{opacity:.28;cursor:default;background:none}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.home-icons{display:flex;margin-right:-10px}
.brand{font-family:var(--font-num);font-weight:900;font-stretch:68%;font-size:34px;line-height:1;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand{min-width:0;text-align:left;border-radius:10px}
.brand>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-ed{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint2);color:var(--fg2);flex:none}
.brand-ed .i{width:16px;height:16px}
.today{color:var(--fg2);font-size:14px;margin-top:-8px}
.card{background:var(--cbg);border:1px solid var(--cborder);border-radius:var(--r-card);padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px;transition:background-color .25s}
.card-head{display:flex;align-items:center;gap:8px;min-height:36px}
.card-head .ib{width:38px;height:38px;margin-right:-8px}
.card-head .ib .i{width:20px;height:20px}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--good)}
.live-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1.6s ease-in-out infinite}
.wtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-10px 0 0;padding:6px 0 8px;}
.wtabs.fl{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
.wtabs.fr{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.wtabs.fl.fr{-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.wtabs::-webkit-scrollbar{display:none}
.wtabs{cursor:grab;-webkit-user-select:none;user-select:none}
.wtabs.grabbing{cursor:grabbing}
.wtabs>[data-hsort]{transition:transform .22s cubic-bezier(.2,.8,.2,1);-webkit-touch-callout:none;touch-action:manipulation}
.wtabs>.dragging{position:relative;z-index:2;transition:none;box-shadow:0 1px 2px rgba(0,0,0,.16),0 2px 5px rgba(0,0,0,.1);background:var(--cbg)}
.wtabs>.dragging.sel{background:var(--ink)}
.wtabs>.dragging.dropping{transition:transform .19s cubic-bezier(.2,.8,.2,1)}
.wtabs.grabbing .chip-sm{pointer-events:none}
.chip-sm{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip-sm.sel{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip-sm .i{width:15px;height:15px}
.card-body{display:flex;flex-direction:column;gap:18px;cursor:pointer;border-radius:12px}
.card-title{font-family:var(--font-num);font-stretch:88%;font-weight:800;font-size:23px;line-height:1.12;text-wrap:balance}
.card-sub{font-size:13px;color:var(--fg2);margin-top:3px}
.pv-grid{display:grid;grid-template-columns:max-content minmax(0,1fr);column-gap:8px;row-gap:6px;align-items:center;font-size:14px;line-height:1.3}
.pv{display:contents}
.pv-label{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);margin-top:6px}
.pv-label:first-child{margin-top:0}
.pv-label .i{width:14px;height:14px}
.pv-s{font-weight:700;font-size:14.5px;white-space:nowrap}
.pv-nt{display:flex;align-items:center;gap:6px;min-width:0}
.pv-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pv-w{color:var(--fg2);font-weight:700;font-size:14px}
.pv-div{grid-column:1/-1;border-top:1px dashed var(--hair);margin-top:6px}
.pv-div+.pv-label{margin-top:2px}
.tap-card{cursor:pointer}
.mp-list{display:flex;flex-direction:column;gap:10px}
.mp{display:grid;grid-template-columns:3em minmax(0,1fr);column-gap:10px;row-gap:1px;align-items:baseline}
.mp-t{font-weight:700;color:var(--fg2);font-size:14.5px}
.mp-n{font-weight:600}
.mp-i{grid-column:2;font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- botões e controles ---------- */
.btn{height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .1s}
.btn .i{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.ghost{border:1px solid var(--hair)}
.btn.danger{color:var(--danger)}
.btn.danger.armed,.btn.danger-solid{background:var(--danger);color:var(--on-ink);border-color:var(--danger)}
.btn.grow{flex:1}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;padding:8px 6px;margin:-4px -6px;border-radius:8px}
.link .i{width:18px;height:18px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--r-row);border:1.5px dashed var(--hair);font-weight:600;font-size:14px;color:var(--fg2);width:100%}
.add .i{width:18px;height:18px}
.add:hover{background:var(--tint)}
.stp{display:inline-flex;align-items:center;height:40px;border-radius:12px;background:var(--tint2);flex:none}
.stp button{width:36px;height:40px;display:grid;place-items:center;border-radius:12px}
.stp button:active{background:var(--tint2)}
.stp button .i{width:18px;height:18px}
.stp input{width:2.9em;height:40px;border:0;background:transparent;text-align:center;font-family:var(--font-num);font-weight:700;font-stretch:80%;font-size:18px;font-variant-numeric:tabular-nums;padding:0;border-radius:8px}
.stp input:focus{outline:2px solid var(--fg);outline-offset:-2px}
.stp .u{font-size:12px;color:var(--fg2);margin:0 2px 0 -6px}
.chk{width:40px;height:40px;border-radius:50%;border:2px solid var(--hair);display:grid;place-items:center;color:transparent;transition:background-color .15s,border-color .15s;flex:none}
.chk .i{width:20px;height:20px;stroke-width:2.8}
.chk.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--tint2);gap:2px;flex-wrap:wrap}
.seg button{height:34px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw-t{width:52px;height:32px;border-radius:999px;background:var(--tint2);border:2px solid var(--hair);position:relative;flex:none;transition:background-color .2s,border-color .2s}
.sw-t span{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--fg2);transition:left .2s,background-color .2s}
.sw-t.on{background:var(--ink);border-color:var(--ink)}
.sw-t.on span{left:24px;background:var(--on-ink)}

/* técnica avançada */
.tq{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;background:var(--ink);color:var(--on-ink);font-family:var(--font-sym);font-weight:900;font-size:15px;line-height:1;flex:none;font-stretch:100%}
.tq-xs{min-width:19px;height:19px;font-size:12.5px;border-radius:6px;padding:0 4px}
.tq{text-box:trim-both cap alphabetic}
@supports not (text-box: trim-both cap alphabetic){.tq{padding-top:2px}}

/* ---------- tela do treino ---------- */
.w-head{display:flex;flex-direction:column;gap:4px;padding:2px 0;border-radius:14px}
.w-head.editing{flex-direction:row;align-items:flex-start;gap:8px;padding:12px 6px 12px 14px;border:1.5px solid var(--hair);border-radius:var(--r-card)}
.w-head-t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.w-head.editing .ex-edit{margin:0}
.w-title{font-family:var(--font-num);font-stretch:86%;font-weight:800;font-size:31px;line-height:1.06;letter-spacing:-.01em;text-wrap:balance}
.w-sub{color:var(--fg2);font-size:14px}
.edit-hint{font-size:13px;color:var(--fg2);display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--tint)}
.edit-hint .i{width:18px;height:18px}
.sec{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--hair);border-radius:var(--r-card);padding:12px}
.log-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1)}
.log-wrap.open{grid-template-rows:1fr}
.log-clip{overflow:hidden;min-height:0}
.chev{flex:none!important;display:grid;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.chev.up{transform:rotate(180deg)}
.log-clip>.legend-b,.log-clip>.log{opacity:0;transform:translateY(-6px);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
.log-wrap.open .log-clip>.legend-b,.log-wrap.open .log-clip>.log{opacity:1;transform:none}
.sec-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);padding:0 2px}
.sec-h .i{width:18px;height:18px}
.count{font-size:12px;letter-spacing:0;background:var(--tint2);color:var(--fg);border-radius:999px;padding:0 8px;line-height:20px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex{background:var(--tint);border-radius:var(--r-row);transition:background-color .2s}
.ex.open{background:var(--tint2)}
.ex-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.ex-head{display:flex;flex-direction:column;gap:5px;padding:12px 6px 12px 14px;min-width:0;border-radius:var(--r-row);width:100%}
.ex.editing .ex-head{cursor:inherit}
.ex-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;line-height:1.25;min-width:0}
.ex-name .nm{min-width:0;overflow-wrap:anywhere}
.ex-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:14.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:999px;background:var(--tint2);line-height:1}
.pill.prog{background:none;padding:0 2px}
.pill .up{width:18px;height:18px;margin-right:-5px}
.scheme,.load{font-weight:700}
.scheme,.load,.reps{white-space:nowrap}
.load{display:inline-flex;align-items:center;gap:5px}
.reps{color:var(--fg2)}
.up{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--good-soft);color:var(--good);flex:none}
.up .i{width:14px;height:14px;stroke-width:2.8}
.pill .up{animation:upIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes upIn{from{opacity:0;transform:translateY(4px) scale(.6)}}
.prog{font-size:12.5px;font-weight:700;color:var(--good);display:inline-flex;align-items:center;gap:3px}
.prog .i{width:15px;height:15px;stroke-width:2.8}
.rest{margin:10px 10px 0 0;height:34px;padding:0 11px 0 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;background:var(--tint2);font-family:var(--font-num);font-weight:700;font-stretch:80%;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background-color .2s}
.rest .i{width:17px;height:17px}
.rest.on{background:var(--accent);color:var(--on-accent)}
.rest.over{background:var(--good);color:var(--on-good)}
.rest.static{margin:0;cursor:default;height:28px;font-size:13.5px}
.tqs{display:inline-flex;gap:4px;flex:none}
.ex-edit{width:40px;height:40px;margin:8px 6px 0 0;color:var(--fg2)}
.ex-edit .i{width:19px;height:19px}
.sortable>[data-sort]{cursor:grab}
.sortable>[data-sort]{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .2s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sortable>.dragging{position:relative;z-index:5;transition:box-shadow .2s;box-shadow:var(--shadow);background:color-mix(in srgb,var(--screen-bg) 72%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);cursor:grabbing}
.sortable>.dragging.dropping{transition:transform .19s cubic-bezier(.2,.8,.2,1),box-shadow .19s}
.reorder{display:flex;flex-direction:column;padding:6px 6px 6px 0}
.reorder .ib{width:38px;height:30px;border-radius:9px}
.reorder .ib .i{width:20px;height:20px}
.log{padding:0 12px 12px;gap:4px;display:flex;flex-direction:column;gap:8px}
.tq-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--tint);font-size:14px;line-height:1.35}
.tq-note b{font-weight:700}
.tq-note .calc{font-family:var(--font-num);font-stretch:80%;font-weight:700;font-variant-numeric:tabular-nums}
.log-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px}
.log-row.load-row{padding:8px 0;margin-bottom:4px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.lbl-box{display:flex;flex-direction:column;gap:1px;min-width:0}
.log .stp{width:140px;height:36px;justify-content:space-between;border-radius:999px;background:none;border:1px solid var(--hair)}
.log .stp button{width:34px;height:34px;border-radius:50%}
.log .stp button .i{width:16px;height:16px}
.log .stp input{flex:1;width:auto;min-width:0;height:34px;font-size:17px}
.key .pill{font-size:14.5px;font-weight:700}
.legend-tq{padding-top:14px;border-top:1px solid var(--hair)}
.lbl{font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap}
.set.is-done .lbl{color:var(--good)}
.hint{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:4px}
.prog-hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--good);font-weight:600}
.cardio{border:1.5px solid var(--hair);border-radius:var(--r-card);padding:12px;display:flex;flex-direction:column;gap:10px}
.cardio-row{display:flex;align-items:center;gap:10px}
.cardio-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;border-radius:10px}
.cardio-main.tap{cursor:pointer;padding:12px 14px;margin:0;background:var(--tint);border-radius:var(--r-row)}

function loadData(hot) {
  if (hot && hot.v === 1) return hot;
  let d = null;
  try { const s = localStorage.getItem(KEY); if (s) { const x = JSON.parse(s); if (x && x.v === 1) d = x; } } catch (e) {}
  if (!d) d = seed();
  // dados salvos antes dos treinos da semana: acrescenta os dias que faltam, sem mexer no resto
  // exercícios antigos tinham uma técnica só (tech); agora é uma lista (techs)
  d.workouts.forEach((w) => allEx(w).forEach((e) => { if (!Array.isArray(e.techs)) { e.techs = e.tech ? [e.tech] : []; delete e.tech; } }));
  if ((d.seedRev || 1) < SEED_REV) {
    const have = new Set(d.workouts.map((w) => norm(w.day).slice(0, 3)));
    weekWorkouts().forEach((w) => { if (!have.has(norm(w.day).slice(0, 3))) d.workouts.push(w); });
    d.seedRev = SEED_REV;
  }
  const today = norm(DOWS[new Date().getDay()]);
  const m = d.workouts.find((w) => norm(w.day).startsWith(today));
  if (m) d.sel = m.id;
  return d;
}

const defaultEntry = (e) => ({ w: e.last.w ?? 0, reps: Array.from({ length: e.sets }, (_, i) => e.last.reps[i] ?? e.max), done: Array(e.sets).fill(false) });
function normEntry(en, e) {
  const d = defaultEntry(e);
  if (!en) return d;
  return { w: en.w ?? d.w, reps: d.reps.map((r, i) => en.reps[i] ?? r), done: d.done.map((_, i) => !!en.done[i]) };
}

let actx = null;
function ensureAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function beep() {
  if (!actx) return;
  try {
    const t0 = actx.currentTime + 0.02;
    [0, 0.22, 0.44].forEach((dt, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.18);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.2);
    });
  } catch (e) {}
}
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
function notifyDone(s) {
  if (s.vibrate) { try { navigator.vibrate && navigator.vibrate([300, 120, 300, 120, 500]); } catch (e) {} }
  if (s.sound) beep();
}

function useNow(active, ms = 250) {

  useEffect(() => {
    if (!active) return;
    setN(Date.now());
    const i = setInterval(() => setN(Date.now()), ms);

  }, [active, ms]);
  return n;
}

const plainSym = (s) => Array.from(s || '').map((ch) => { const cp = ch.codePointAt(0); if (cp >= 0x1D41A && cp <= 0x1D433) return String.fromCharCode(97 + cp - 0x1D41A); if (cp >= 0x1D400 && cp <= 0x1D419) return String.fromCharCode(97 + cp - 0x1D400); return ch; }).join('');

function Stepper({ id, value, step = 1, min = 0, max = 999, unit, decimals, onChange, label }) {
  const [txt, setTxt] = useState(null);
  const shown = txt ?? fmtNum(value);
  const bump = (dir) => onChange(clamp(r2((value || 0) + dir * step), min, max));
  return html`<div class="stp">
    <button type="button" aria-label=${'Diminuir ' + (label || '')} onClick=${() => bump(-1)}>${I.minus()}</button>
    <input id=${id} inputmode=${decimals ? 'decimal' : 'numeric'} autocomplete="off" value=${shown} aria-label=${label || unit}
      onInput=${(ev) => { setTxt(ev.target.value); const v = parseNum(ev.target.value); if (v != null) onChange(clamp(v, min, max)); }}
      onBlur=${() => setTxt(null)}
      onFocus=${(ev) => ev.target.select()}
      onKeyDown=${(ev) => { if (ev.key === 'Enter') ev.target.blur(); }} />
    ${unit && html`<span class="u">${unit}</span>`}
    <button type="button" aria-label=${'Aumentar ' + (label || '')} onClick=${() => bump(1)}>${I.plus()}</button>
  </div>`;
}

/* Reordenar segurando e arrastando, como as notas do Google Keep:
   segurar ~0,3 s levanta o item; os outros deslizam para abrir espaço. */
function useSortable(enabled, onMove) {
  const ref = useRef(null);
  const moveRef = useRef(onMove); moveRef.current = onMove;
  const pending = useRef(false);
  const dragged = useRef(false);
  useLayoutEffect(() => {
    if (!pending.current || !ref.current) return;
    pending.current = false;
    [...ref.current.children].forEach((el) => { el.style.transition = 'none'; el.style.transform = ''; el.classList.remove('dragging', 'dropping'); void el.offsetHeight; el.style.transition = ''; });
  });
  useEffect(() => {
    const box = ref.current;
    if (!box || !enabled) return;
    let timer = null;
    const items = () => [...box.children].filter((x) => x.hasAttribute('data-sort'));
    const begin = (el, startY, pid) => {
      const els = items(); const from = els.indexOf(el);
      if (from < 0) return;
      const rects = els.map((x) => x.getBoundingClientRect());
      const gap = rects.length > 1 ? rects[1].top - rects[0].bottom : 8;
      const h = rects[from].height + gap;
      let to = from;
      dragged.current = true;
      el.classList.add('dragging');
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
      const noScroll = (e) => e.preventDefault();
      const move = (e) => {
        if (e.pointerId !== pid) return;
        const dy = e.clientY - startY;
        el.style.transform = `translateY(${dy}px) scale(1.03)`;
        const center = rects[from].top + rects[from].height / 2 + dy;
        let t = from;
        els.forEach((_, i) => {
          const mid = rects[i].top + rects[i].height / 2;
          if (i < from && center < mid) t = Math.min(t, i);
          if (i > from && center > mid) t = Math.max(t, i);
        });
        to = t;
        els.forEach((x, i) => {
          if (i === from) return;
          const shift = from < to && i > from && i <= to ? -h : to < from && i >= to && i < from ? h : 0;
          x.style.transform = shift ? `translateY(${shift}px)` : '';
        });
      };
      const end = (e) => {
        if (e.pointerId !== pid) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
        window.removeEventListener('pointercancel', end);
        window.removeEventListener('touchmove', noScroll);
        let target = 0;
        if (to > from) for (let i = from + 1; i <= to; i++) target += rects[i].height + gap;
        if (to < from) for (let i = to; i < from; i++) target -= rects[i].height + gap;
        el.classList.add('dropping');
        el.style.transform = `translateY(${target}px)`;
        setTimeout(() => {
          setTimeout(() => { dragged.current = false; }, 60);
          if (to !== from) { pending.current = true; moveRef.current(from, to); }
          else { els.forEach((x) => { x.style.transform = ''; }); el.classList.remove('dragging', 'dropping'); }
        }, 190);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
      window.addEventListener('touchmove', noScroll, { passive: false });
    };
    const down = (ev) => {
      if (ev.button) return;
      const el = ev.target.closest('[data-sort]');
      if (!el || el.parentElement !== box) return;
      const x0 = ev.clientX, y0 = ev.clientY, pid = ev.pointerId;
      const stop = () => { clearTimeout(timer); window.removeEventListener('pointermove', pre); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); };
      const mouse = ev.pointerType === 'mouse';
      // mouse: arrasta assim que se move; dedo: segurar ~0,3 s (mover antes disso é rolar a tela)
      const pre = (e) => {
        if (e.pointerId !== pid || Math.hypot(e.clientX - x0, e.clientY - y0) <= (mouse ? 4 : 8)) return;
        stop();
        if (mouse) { begin(el, y0, pid); window.dispatchEvent(new PointerEvent('pointermove', e)); }
      };
      window.addEventListener('pointermove', pre);
      window.addEventListener('pointerup', stop);
      window.addEventListener('pointercancel', stop);
      if (!mouse) timer = setTimeout(() => { stop(); begin(el, y0, pid); }, 300);
    };
    const noMenu = (e) => { if (e.target.closest('[data-sort]')) e.preventDefault(); };
    const noClickAfterDrag = (e) => { if (dragged.current) { e.stopPropagation(); e.preventDefault(); } };
    box.addEventListener('pointerdown', down);
    box.addEventListener('contextmenu', noMenu);
    box.addEventListener('click', noClickAfterDrag, true);
    return () => { clearTimeout(timer); box.removeEventListener('pointerdown', down); box.removeEventListener('contextmenu', noMenu); box.removeEventListener('click', noClickAfterDrag, true); };
  }, [enabled]);
  return ref;
}

// rolar uma faixa horizontal arrastando com o mouse (no celular o dedo já rola)
function useDragScroll(dep) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    let x0 = 0, s0 = 0, pid = null, moved = false;
    const down = (e) => { if (e.pointerType !== 'mouse' || e.button) return; pid = e.pointerId; x0 = e.clientX; s0 = el.scrollLeft; moved = false; };
    const move = (e) => {
      if (e.pointerId !== pid || el.dataset.sorting) return;
      const dx = e.clientX - x0;
      if (!moved && Math.abs(dx) > 4) { moved = true; el.classList.add('grabbing'); }
      if (moved) el.scrollLeft = s0 - dx;
    };
    const up = (e) => { if (e.pointerId !== pid) return; pid = null; el.classList.remove('grabbing'); };
    const click = (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } };
    // fade só nos lados em que ainda há dias escondidos
    const edges = () => {
      el.classList.toggle('fl', el.scrollLeft > 2);
      el.classList.toggle('fr', el.scrollLeft + el.clientWidth < el.scrollWidth - 2);
    };
    edges();
    el.addEventListener('scroll', edges, { passive: true });
    window.addEventListener('resize', edges);
    const ro = window.ResizeObserver ? new ResizeObserver(edges) : null;
    if (ro) ro.observe(el);
    const wheel = (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && el.scrollWidth > el.clientWidth) { el.scrollLeft += e.deltaY; e.preventDefault(); } };
    el.addEventListener('pointerdown', down);
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    el.addEventListener('click', click, true);
    el.addEventListener('wheel', wheel, { passive: false });
    return () => { el.removeEventListener('pointerdown', down); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); el.removeEventListener('click', click, true); el.removeEventListener('wheel', wheel); el.removeEventListener('scroll', edges); window.removeEventListener('resize', edges); if (ro) ro.disconnect(); };
  }, [dep]);
  return ref;
}

// reordenar as abas dos treinos: segurar ~0,3 s na aba e arrastar para o lado
function useTabSort(ref, dep, onMove) {
  const moveRef = useRef(onMove); moveRef.current = onMove;
  const pending = useRef(false);
  useLayoutEffect(() => {
    if (!pending.current || !ref.current) return;
    pending.current = false;
    [...ref.current.children].forEach((x) => { x.style.transition = 'none'; x.style.transform = ''; x.classList.remove('dragging', 'dropping'); void x.offsetWidth; x.style.transition = ''; });
  });
  useEffect(() => {
    const el = ref.current; if (!el) return;
    let timer = null, dragged = false;
    const begin = (chip, cx0, pid) => {
      const items = [...el.querySelectorAll(':scope > [data-hsort]')];
      const from = items.indexOf(chip); if (from < 0) return;
      const box = el.getBoundingClientRect();
      const left = (x) => x.getBoundingClientRect().left - box.left + el.scrollLeft;
      const pos = items.map((x) => ({ l: left(x), w: x.offsetWidth }));
      const gap = pos.length > 1 ? pos[1].l - (pos[0].l + pos[0].w) : 6;
      const span = pos[from].w + gap;
      const startX = cx0 - box.left + el.scrollLeft;
      let to = from, lastX = cx0, raf = 0;
      dragged = true; el.dataset.sorting = '1'; chip.classList.add('dragging');
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
      const layout = () => {
        const dx = lastX - box.left + el.scrollLeft - startX;
        chip.style.transform = `translateX(${dx}px) scale(1.06)`;
        const center = pos[from].l + pos[from].w / 2 + dx;
        let t = from;
        pos.forEach((p, i) => { const mid = p.l + p.w / 2; if (i < from && center < mid) t = Math.min(t, i); if (i > from && center > mid) t = Math.max(t, i); });
        to = t;
        items.forEach((x, i) => { if (i === from) return; const sh = from < to && i > from && i <= to ? -span : to < from && i >= to && i < from ? span : 0; x.style.transform = sh ? `translateX(${sh}px)` : ''; });
      };
      // perto da borda, a faixa rola sozinha
      const tick = () => { const edge = 36; if (lastX < box.left + edge) el.scrollLeft -= 6; else if (lastX > box.right - edge) el.scrollLeft += 6; layout(); raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick);
      const noScroll = (e) => e.preventDefault();
      const move = (e) => { if (e.pointerId === pid) lastX = e.clientX; };
      const end = (e) => {
        if (e.pointerId !== pid) return;
        cancelAnimationFrame(raf);
        window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', end); window.removeEventListener('pointercancel', end); window.removeEventListener('touchmove', noScroll);
        let target = 0;
        if (to > from) for (let i = from + 1; i <= to; i++) target += pos[i].w + gap;
        if (to < from) for (let i = to; i < from; i++) target -= pos[i].w + gap;
        chip.classList.add('dropping'); chip.style.transform = `translateX(${target}px)`;
        setTimeout(() => {
          delete el.dataset.sorting;
          setTimeout(() => { dragged = false; }, 60);
          if (to !== from) { pending.current = true; moveRef.current(from, to); }
          else { items.forEach((x) => { x.style.transform = ''; }); chip.classList.remove('dragging', 'dropping'); }
        }, 190);
      };
      window.addEventListener('pointermove', move); window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
      window.addEventListener('touchmove', noScroll, { passive: false });
    };
    const down = (ev) => {
      if (ev.button) return;
      const chip = ev.target.closest('[data-hsort]'); if (!chip || chip.parentElement !== el) return;
      const x0 = ev.clientX, y0 = ev.clientY, pid = ev.pointerId;
      const stop = () => { clearTimeout(timer); window.removeEventListener('pointermove', pre); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); };
      const pre = (e) => { if (e.pointerId === pid && Math.hypot(e.clientX - x0, e.clientY - y0) > 6) stop(); };
      window.addEventListener('pointermove', pre); window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop);
      timer = setTimeout(() => { stop(); begin(chip, x0, pid); }, 300);
    };
    const noClick = (e) => { if (dragged) { e.stopPropagation(); e.preventDefault(); } };
    const noMenu = (e) => { if (e.target.closest('[data-hsort]')) e.preventDefault(); };
    el.addEventListener('pointerdown', down);
    el.addEventListener('click', noClick, true);
    el.addEventListener('contextmenu', noMenu);
    return () => { clearTimeout(timer); el.removeEventListener('pointerdown', down); el.removeEventListener('click', noClick, true); el.removeEventListener('contextmenu', noMenu); };
  }, [dep]);
}

function TimerWatcher() {
  const c = useCtx(); const t = c.timer;
  const now = useNow(!!t, 500);
  useEffect(() => {
    if (!t) return;
    if (!t.alerted && now >= t.endAt) {
      notifyDone(c.data.settings);
      c.setTimer((x) => (x && x.id === t.id ? { ...x, alerted: true } : x));
    } else if (now - t.endAt > 5 * 60 * 1000) c.stopTimer();
  }, [now, t]);
  return null;
}

function ExerciseSheet({ wid, eid, section }) {
  const c = useCtx();
  const w = c.data.workouts.find((x) => x.id === wid);
  const orig = w && eid ? findEx(w, eid) : null;
  const sec = orig ? (w.warmup.some((x) => x.id === eid) ? 'warmup' : 'main') : section || 'main';
  const [f, setF] = useState(() => (orig ? { ...clone(orig), techs: techIds(orig) } : {
    id: uid(), name: '', techs: [], sets: 0, min: 0, max: 0,
    last: { w: 0, reps: [] }, rest: sec === 'warmup' ? 15 : c.data.settings.rest,
  }));
  const [custom, setCustom] = useState(() => !RESTS.includes(f.rest));
  const [err, setErr] = useState('');
  const [del, setDel] = useState(false);
  if (!w) return null;
  const S = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const setRep = (i, v) => setF((p) => { const reps = Array.from({ length: p.sets }, (_, j) => p.last.reps[j] ?? null); reps[i] = v; return { ...p, last: { ...p.last, reps } }; });
  const toggleTech = (id) => setF((p) => ({ ...p, techs: p.techs.includes(id) ? p.techs.filter((x) => x !== id) : [...p.techs, id] }));
  const names = [...new Set(c.data.workouts.flatMap((x) => allEx(x).map((e) => e.name)))].sort();
  const save = () => {
    const name = f.name.trim();
    if (!name) { setErr('Dê um nome ao exercício.'); document.getElementById('ex-name')?.focus(); return; }
    if (f.sets < 1 || f.max < 1) { setErr(f.sets < 1 ? 'Coloque pelo menos 1 série.' : 'Coloque quantas repetições por série.'); return; }
    const typed = f.last.reps.slice(0, f.sets).some((r) => r != null);

      <div class="chips">

        ${c.data.techniques.map((x) => { const on = f.techs.includes(x.id); return html`<button type="button" class=${'chip' + (on ? ' sel' : '')} aria-pressed=${on} onClick=${() => toggleTech(x.id)}><${Tq} t=${x} />${x.name}</button>`; })}
      </div>
    </div>
    <div class="field"><label for="ex-sets">Séries</label><${Stepper} id="ex-sets" value=${f.sets} min=${0} max=${10} label="séries" onChange=${(v) => { S('sets', v); setErr(''); }} /></div>
    <div class="field">
      <span class="flabel">Repetições por série</span>
      <div class="row">
        <${Stepper} id="ex-min" value=${f.min} min=${0} max=${100} label="reps mínimas" onChange=${(v) => setF((p) => ({ ...p, min: v, max: Math.max(v, p.max) }))} />
        <span class="mut">até</span>
        <${Stepper} id="ex-max" value=${f.max} min=${0} max=${100} label="reps máximas" onChange=${(v) => setF((p) => ({ ...p, max: v, min: Math.min(v, p.min) }))} />
      </div>
    </div>
    <div class="field">
      <span class="flabel help-l"><label for="ex-w">Carga da última vez</label><${Help} text="Qual carga você usou da última vez que fez este exercício? Não precisa preencher se ainda não fez ou não lembra: dá para preencher depois, durante o treino." /></span>
      <${Stepper} id="ex-w" value=${f.last.w} min=${0} max=${999} unit="kg" decimals label="carga da última vez" onChange=${(v) => setF((p) => ({ ...p, last: { ...p.last, w: v } }))} />

      <div class="reps-in">${Array.from({ length: f.sets }, (_, i) => html`<input class="txt rep" id=${'ex-r' + i} inputmode="numeric" autocomplete="off" aria-label=${'Reps feitas na série ' + (i + 1)} placeholder=${'S' + (i + 1)} value=${fmtNum(f.last.reps[i])} onInput=${(ev) => setRep(i, parseNum(ev.target.value))} />`)}</div>

function LineChart({ pts }) {
  const [sel, setSel] = useState(pts.length - 1);
  const W = 340, H = 170, L = 40, R = 18, T = 14, B = 28;
  const ws = pts.map((p) => p.w);
  let lo = Math.min(...ws), hi = Math.max(...ws);
  if (hi - lo < 2) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / 3, p10 = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p10;
  const st = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p10;
  lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += st) ticks.push(r2(v));
  const cnt = pts.length;
  const x = (i) => L + (cnt === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (cnt - 1));
  const y = (v) => T + ((hi - v) / (hi - lo)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(' ');
  const area = `${line} L${x(cnt - 1).toFixed(1)} ${y(lo).toFixed(1)} L${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`;
  const hw = cnt > 1 ? (W - L - R) / (cnt - 1) / 2 : 30;
  const p = pts[sel];
  return html`<figure class="chart">
    <figcaption>
      <span class="eyebrow">Carga ao longo do tempo</span>
      <span class="readout"><b class="num">${kg(p.w)}</b> · ${fmtShort(p.date)} · ${p.reps.join(' · ')} reps</span>
    </figcaption>
    <svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${`Carga de ${kg(pts[0].w)} para ${kg(pts[cnt - 1].w)} em ${cnt} treinos`}>
      ${ticks.map((v) => html`<line class="grid" x1=${L} x2=${W - R} y1=${y(v)} y2=${y(v)} /><text class="ax" x=${L - 8} y=${y(v) + 4} text-anchor="end">${fmtNum(v)}</text>`)}
      <path class="area" d=${area} />
      <line class="xh" x1=${x(sel)} x2=${x(sel)} y1=${T} y2=${H - B} />
      <path class="ln" d=${line} />
      ${pts.map((q, i) => html`<circle class=${'pt' + (i === sel ? ' on' : '')} cx=${x(i)} cy=${y(q.w)} r=${i === sel ? 5.5 : 4} />`)}
      <text class="ax" x=${x(0)} y=${H - 8} text-anchor="start">${fmtDM(pts[0].date)}</text>
      ${cnt > 1 && html`<text class="ax" x=${x(cnt - 1)} y=${H - 8} text-anchor="end">${fmtDM(pts[cnt - 1].date)}</text>`}
      ${pts.map((q, i) => html`<rect class="hit" x=${x(i) - hw} y="0" width=${hw * 2} height=${H} onClick=${() => setSel(i)} onPointerEnter=${() => setSel(i)} />`)}
    </svg>
  </figure>`;
}

function HistorySheet({ wid, eid }) {
  const c = useCtx();
  const w = c.data.workouts.find((x) => x.id === wid);
  const e = w && findEx(w, eid);
  const pts = c.data.sessions
    .filter((s) => s.items.some((i) => i.eid === eid))
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .map((s) => { const it = s.items.find((i) => i.eid === eid); return { date: s.date, w: it.w, reps: it.reps, sample: s.sample }; });
  const last = pts[pts.length - 1];
  const best = pts.reduce((b, p) => (!b || p.w > b.w ? p : b), null);
  const delta = pts.length ? r2(last.w - pts[0].w) : 0;
  return html`<${Sheet} title=${e ? e.name : 'Histórico'}>
    ${!pts.length
      ? html`<p class="empty">Ainda não há registros deste exercício. Conclua um treino com ele para começar o histórico.</p>`
      : html`
        <div class="stats">
          <div class="stat"><span class="eyebrow">Última vez</span><span class="num big">${kg(last.w)}</span><span class="mut num">${last.reps.join(' · ')}</span></div>
          <div class="stat"><span class="eyebrow">Maior carga</span><span class="num big">${kg(best.w)}</span><span class="mut">${fmtDM(best.date)}</span></div>
          <div class="stat"><span class="eyebrow">Evolução</span><span class="num big">${delta > 0 ? '+' : ''}${fmtNum(delta)} kg</span><span class="mut">em ${pts.length} treinos</span></div>
        </div>
        ${pts.length >= 2 && html`<${LineChart} pts=${pts} />`}
        <ul class="hist-list">${pts.slice().reverse().map((p) => html`<li><span>${fmtShort(p.date)}</span><span class="num w">${kg(p.w)}</span><span class="num r">${p.reps.join(' · ')}</span></li>`)}</ul>

}

function SheetHost({ s }) {
  const map = { name: NameSheet, session: SessionSheet, exercise: ExerciseSheet, cardio: CardioSheet, meta: MetaSheet, color: ColorSheet, history: HistorySheet, meal: MealSheet, tech: TechSheet, confirm: ConfirmSheet };
  const C = map[s.type];
  return C ? html`<${C} key=${s.n} ...${s} />` : null;
}

/* ================= dieta, histórico, ajustes ================= */
function DietScreen() {
  const c = useCtx(); const d = c.data.diet;
  const [edit, setEdit] = useState(false);
  const move = (i, dir) => c.up((x) => { const a = x.diet.meals; const j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; x.diet.sample = false; });
  return html`<div class="screen"><div class="wrap">
    <${TopBar}>
      <button class="ib" aria-label="Cor do card" onClick=${() => c.openSheet({ type: 'color', target: 'diet' })}>${I.palette()}</button>
      <button class=${'ib' + (edit ? ' on' : '')} aria-label=${edit ? 'Concluir edição' : 'Editar dieta'} onClick=${() => setEdit(!edit)}>${edit ? I.check() : I.edit()}</button>
    <//>
    <header class="w-head">
      <span class="eyebrow">Dieta${d.sample ? ' · exemplo' : ''}</span>
      <h1 class="w-title">Plano alimentar</h1>
      <span class="w-sub">${d.meals.length} refeições</span>
    </header>
    ${edit && html`<p class="edit-hint">${I.edit()}<span>Toque em uma refeição para editar.</span></p>`}
    <div class="meals">
      ${d.meals.map((m, i) => html`<div class=${'meal' + (edit ? ' tap' : '')} key=${m.id} ...${edit ? tap(() => c.openSheet({ type: 'meal', mid: m.id })) : {}}>
        <div class="meal-h"><span class="meal-n">${m.name}</span>${m.time && html`<span class="meal-t num">${m.time}</span>`}</div>
        <ul class="items">${m.items.map((it) => html`<li key=${it.id}><span class="q num">${it.q}</span><span class="arr" aria-hidden="true">→</span><span>${it.f}</span></li>`)}</ul>
        ${m.note && html`<p class="meal-note">${m.note}</p>`}
        ${edit && html`<div class="row" onClick=${(e) => e.stopPropagation()}>
          <button class="ib" aria-label="Mover para cima" disabled=${i === 0} onClick=${() => move(i, -1)}>${I.upc()}</button>
          <button class="ib" aria-label="Mover para baixo" disabled=${i === d.meals.length - 1} onClick=${() => move(i, 1)}>${I.down()}</button>
        </div>`}
      </div>`)}
    </div>
    ${edit && html`<button class="add" onClick=${() => c.openSheet({ type: 'meal' })}>${I.plus()} Adicionar refeição</button>`}
    <section class="cardio notes" aria-label="Observações">
      <h2 class="sec-h"><span>Observações</span></h2>
      ${edit
        ? html`<textarea id="diet-notes" class="txt" rows="3" aria-label="Observações da dieta" value=${d.notes} onInput=${(ev) => c.up((x) => { x.diet.notes = ev.target.value; x.diet.sample = false; })}></textarea>`
        : html`<p>${d.notes || 'Nenhuma observação.'}</p>`}
    </section>
  </div></div>`;
}

function HistoryScreen() {
  const c = useCtx();
  const [open, setOpen] = useState(null);
  const list = c.data.sessions.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  return html`<div class="screen"><div class="wrap">
    <${TopBar} />
    <h1 class="page-title">Histórico</h1>
    <p class="page-sub">${list.length ? `${list.length} treinos salvos` : 'Nenhum treino salvo'}</p>
    ${!list.length
      ? html`<p class="empty">Quando você concluir um treino, ele aparece aqui com a carga e as reps de cada exercício.</p>`
      : html`<ul class="sess-list">${list.map((s) => { const d = parseISO(s.date); const isOpen = open === s.id; return html`<li class="sess" key=${s.id}>
          <button type="button" class="sess-h" aria-expanded=${isOpen} onClick=${() => setOpen(isOpen ? null : s.id)}>
            <span class="sess-date"><span class="num dnum">${d.getDate()}</span><span class="dmon">${MONS[d.getMonth()]}</span></span>
            <span class="sess-main"><span class="sess-title">${s.title}</span><span class="mut sm">${DOWS[d.getDay()]} · ${s.items.length} exercícios · ${s.dur} min${s.cardio ? ' · cardio' : ''}</span></span>
            ${s.sample && html`<span class="tag">exemplo</span>`}
            ${isOpen ? I.upc() : I.down()}
          </button>
          ${isOpen && html`<ul class="sess-items">${s.items.map((it, i) => html`<li key=${i}><span>${it.name}</span><span class="num">${kg(it.w)}</span><span class="num mut">${it.reps.join(' · ')}</span></li>`)}</ul>`}
        </li>`; })}</ul>`}
  </div></div>`;
}

function SettingsScreen() {
  const c = useCtx(); const s = c.data.settings;
  const set = (k, v) => c.up((d) => { d.settings[k] = v; });
  const hasSample = c.data.sessions.some((x) => x.sample);
  return html`<div class="screen"><div class="wrap">
    <${TopBar} />
    <h1 class="page-title">Ajustes</h1>
    <section class="set-group" aria-label="Aparência">
      <h2 class="eyebrow">Aparência</h2>
      <div class="set-row"><span>Tema</span>
        <div class="seg">${[['system', 'Sistema'], ['light', 'Claro'], ['dark', 'Escuro']].map(([k, l]) => html`<button type="button" class=${s.theme === k ? 'on' : ''} aria-pressed=${s.theme === k} onClick=${() => set('theme', k)}>${l}</button>`)}</div>
      </div>
    </section>
    <section class="set-group" aria-label="Descanso">
      <h2 class="eyebrow">Cronômetro de descanso</h2>
      <div class="set-row"><label for="set-rest">Tempo padrão<span class="mut sm block">Usado em exercícios novos</span></label><${Stepper} id="set-rest" value=${s.rest} step=${15} min=${0} max=${600} unit="s" label="tempo padrão" onChange=${(v) => set('rest', v)} /></div>
      <${Toggle} id="set-sound" label="Som ao terminar" on=${s.sound} onChange=${(v) => set('sound', v)} />
      <${Toggle} id="set-vib" label="Vibrar ao terminar" hint="Funciona na maioria dos celulares Android" on=${s.vibrate} onChange=${(v) => set('vibrate', v)} />
    </section>
    <section class="set-group" aria-label="Técnicas avançadas">
      <h2 class="eyebrow">Técnicas avançadas (legenda)</h2>
      <ul>${c.data.techniques.map((t) => html`<li key=${t.id}><button type="button" class="tech-row" onClick=${() => c.openSheet({ type: 'tech', tid: t.id })}><${Tq} t=${t} /><span><b>${t.name}</b><span class="mut sm block">${t.desc}</span></span>${I.chev()}</button></li>`)}</ul>
      <button type="button" class="add" onClick=${() => c.openSheet({ type: 'tech' })}>${I.plus()} Nova técnica</button>
    </section>
    <section class="set-group" aria-label="Dados">
      <h2 class="eyebrow">Dados</h2>
      <p class="mut sm">Neste protótipo os dados ficam salvos só neste navegador.</p>
      <div class="data-actions">
        ${hasSample && html`<button type="button" class="btn ghost" onClick=${() => c.openSheet({ type: 'confirm', title: 'Apagar sessões de exemplo?', text: 'O histórico de exemplo sai. Os treinos que você concluiu continuam.', label: 'Apagar exemplos', onOk: () => { c.up((d) => { d.sessions = d.sessions.filter((x) => !x.sample); }); c.toast('Exemplos apagados'); } })}>Apagar exemplos</button>`}
        <button type="button" class="btn ghost" onClick=${() => c.openSheet({ type: 'confirm', title: 'Recomeçar do exemplo?', text: 'Treinos, dieta, técnicas e histórico voltam para os dados de exemplo. O que você mudou será perdido.', label: 'Recomeçar', onOk: () => { c.replace(seed()); c.toast('Dados de exemplo restaurados'); } })}>Restaurar exemplo</button>
      </div>
    </section>
    <p class="foot mut sm">Ficha · protótipo 0.1</p>
  </div></div>`;
}

/* ================= app ================= */
function App({ hot }) {
  const [data, setData] = useState(() => loadData(hot));
  const [stack, setStack] = useState([{ name: 'home' }]);
  const [sheet, setSheet] = useState(null);
  const [timer, setTimer] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const toastRef = useRef(0);
  const route = stack[stack.length - 1];
  latest = data;

  const up = useCallback((fn) => setData((d) => { const n = clone(d); fn(n); return n; }), []);
  useEffect(() => { const t = setTimeout(() => saveData(data), 120); return () => clearTimeout(t); }, [data]);

  useEffect(() => {
    const r = document.documentElement; const t = data.settings.theme;
    if (t === 'system') { if (HOST_THEME) r.setAttribute('data-theme', HOST_THEME); else r.removeAttribute('data-theme'); }
    else r.setAttribute('data-theme', t);
  }, [data.settings.theme]);

  useEffect(() => {
    let col = null;
    if (route.name === 'workout') { const w = data.workouts.find((x) => x.id === route.id); col = w && w.color; }
    else if (route.name === 'diet') col = data.diet.color;
    document.documentElement.style.setProperty('--screen-bg', col ? `var(--c-${col})` : 'var(--bg)');
    // no app instalado, a barra de status do celular acompanha a cor da tela
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--screen-bg').trim() || '#202124');
  }, [route, data]);

  useEffect(() => {
    const v = () => { if (document.visibilityState === 'visible' && timer) keepAwake(true); };
    document.addEventListener('visibilitychange', v);
    return () => document.removeEventListener('visibilitychange', v);
  }, [timer]);

  const toast = (m) => { setToastMsg(m); clearTimeout(toastRef.current); toastRef.current = setTimeout(() => setToastMsg(null), 2600); };
  const go = (r) => { setStack((s) => [...s, r]); setSheet(null); window.scrollTo(0, 0); };
  const back = () => { setStack((s) => (s.length > 1 ? s.slice(0, -1) : s)); window.scrollTo(0, 0); };
  const home = () => { setStack([{ name: 'home' }]); window.scrollTo(0, 0); };
  const openSheet = (s) => setSheet({ ...s, n: Date.now() + Math.random() });
  const closeSheet = () => setSheet((cur) => {
    if (!cur || cur.closing) return cur;
    const n = cur.n;
    setTimeout(() => setSheet((x) => (x && x.n === n ? null : x)), 220);
    return { ...cur, closing: true };
  });
  const startTimer = ({ key, label, secs, kind = 'rest' }) => {
    if (!secs) return;
    ensureAudio(); keepAwake(true);
    setTimer({ id: uid(), key, label, kind, total: secs, endAt: Date.now() + secs * 1000, alerted: false });
  };
  const stopTimer = () => { setTimer(null); keepAwake(false); };
  const finish = () => {
    const L = data.live; const W = L && data.workouts.find((x) => x.id === L.wid);
    if (!W) return;
    const touched = allEx(W).filter((e) => L.ex[e.id]);
    const anyCardio = Object.values(L.cardio).some(Boolean);
    if (!touched.length && !anyCardio) { toast('Abra ou ajuste ao menos um exercício antes de concluir'); return; }
    up((d) => {
      const LL = d.live; const WW = d.workouts.find((x) => x.id === LL.wid);
      const items = [];
      for (const e of allEx(WW)) {
        if (!LL.ex[e.id]) continue;
        const en = normEntry(LL.ex[e.id], e);
        e.last = { w: en.w, reps: en.reps.slice() };
        if (WW.main.some((x) => x.id === e.id)) items.push({ eid: e.id, name: e.name, w: en.w, reps: en.reps.slice() });
      }
      d.sessions.push({ id: uid(), date: todayISO(), wid: WW.id, title: WW.title, day: WW.day, dur: Math.max(1, Math.round((Date.now() - LL.start) / 60000)), cardio: Object.values(LL.cardio).some(Boolean), items });
      d.live = null;
    });
    stopTimer();
    toast('Treino salvo no histórico');
  };
  const askDiscard = () => openSheet({ type: 'confirm', title: 'Descartar treino de hoje?', text: 'As séries marcadas não serão salvas no histórico.', label: 'Descartar', onOk: () => { up((d) => { d.live = null; }); stopTimer(); } });
  const replace = (d) => { setData(d); setTimer(null); home(); };
  const deleteWorkout = (id) => {
    up((d) => { d.workouts = d.workouts.filter((x) => x.id !== id); if (d.live && d.live.wid === id) d.live = null; if (d.sel === id) d.sel = d.workouts[0] ? d.workouts[0].id : null; });
    home(); toast('Treino excluído');
  };

  const ctx = { data, up, route, go, back, home, openSheet, closeSheet, sheetClosing: !!(sheet && sheet.closing), timer, setTimer, startTimer, stopTimer, toast, finish, askDiscard, replace, deleteWorkout };
  let screen;
  if (route.name === 'workout') screen = html`<${WorkoutScreen} key=${route.id} id=${route.id} startEdit=${route.edit} />`;
  else if (route.name === 'diet') screen = html`<${DietScreen} />`;
  else if (route.name === 'history') screen = html`<${HistoryScreen} />`;
  else if (route.name === 'settings') screen = html`<${SettingsScreen} />`;
  else screen = html`<${Home} />`;

  return html`<${Ctx.Provider} value=${ctx}>
    ${screen}
    <${TimerWatcher} />
    ${sheet && html`<${SheetHost} s=${sheet} />`}
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
  <//>`;
}

const start = (hotData) => render(html`<${App} hot=${hotData && hotData.data} />`, document.getElementById('app'));
try { window.claude?.hot?.snapshot?.(() => ({ data: latest })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
